# Builds and publishes the container image to GitHub Container Registry.
#
# The image is only buildable on a real builder, and this repo has no local
# docker daemon, so CI is where it happens. Multi-arch is not optional here: the
# Dockerfile downloads a pinned xray per TARGETARCH, so the two architectures
# are genuinely different builds.
#
# Pushes happen on a release tag or when you ask for them by hand. A pull
# request gets a build with no push, which is the point: it proves the Dockerfile
# still works, including the xray download and its checksum, without publishing
# anything.

name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push, e.g. "latest" or a version. Leave empty for the SHA only.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push the image; the default token cannot write packages.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (so one runner can build arm64 too)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space
        run: |
          # The runner image is fat and this job pulls a Go toolchain, two xray
          # zips and build cache. Without this the arm64 leg runs out of space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # No "latest" by default: a SHA tag per build, plus the version when a
          # release drives the build. Pushing latest from every main commit
          # would make the tag a lie about what is deployed.
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=${{ inputs.tag }}
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          echo "published:" >> "$GITHUB_STEP_SUMMARY"
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:<tag>" >> "$GITHUB_STEP_SUMMARY"